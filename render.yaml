# Render Blueprint: one web service that serves the API (/api/*) and the
# built React app (every other path) from the same origin, so the admin
# session cookie is first-party and needs no cross-site CORS.
#
# Secrets marked `sync: false` are entered in the Render dashboard when the
# Blueprint is created; they are never stored in this file.
services:
  - type: web
    name: edtech-crm
    runtime: node
    plan: free
    # NODE_ENV=production makes `npm ci` skip devDependencies; the frontend
    # needs them (Vite) to build, the backend does not need them at runtime.
    buildCommand: >-
      npm ci --prefix backend --omit=dev &&
      npm ci --prefix frontend --include=dev &&
      npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      # Render puts one proxy in front of the service.
      - key: TRUST_PROXY
        value: "1"
      # Random 256-bit value generated by Render on first deploy.
      - key: JWT_SECRET
        generateValue: true
      # Supabase session-pooler connection string.
      - key: DATABASE_URL
        sync: false
      # Supabase root CA certificate (PEM), required for verify-full TLS.
      - key: DATABASE_SSL_CA
        sync: false
      # FRONTEND_URL defaults to the service's RENDER_EXTERNAL_URL; set it
      # only to add a custom domain (comma-separated origins).
